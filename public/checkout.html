<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Reference Review - ThuruvanPay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4">

  <!-- Payment Container -->
  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-200 overflow-hidden relative">
    
    <!-- Top Bar -->
    <div class="bg-gradient-to-r from-indigo-600 to-indigo-700 p-6 text-white text-center relative">
      <div class="flex items-center justify-between text-xs opacity-80 mb-3">
        <span class="flex items-center gap-1"><i class="fa-solid fa-shield-halved"></i> 256-Bit SSL Encrypted</span>
        <span id="countdown" class="bg-indigo-800/80 px-2.5 py-0.5 rounded-full font-bold mono">Paused</span>
      </div>

      <p class="text-xs uppercase tracking-wider font-semibold opacity-90" id="merchant-title">Paying to Merchant</p>
      <div class="mt-1 flex items-baseline justify-center gap-1">
        <span class="text-xl font-bold opacity-80">₹</span>
        <h1 class="text-4xl font-extrabold tracking-tight" id="order-amount">0.00</h1>
      </div>
      <p class="text-[11px] opacity-75 mt-1 mono" id="order-id-label">Order: Loading...</p>
    </div>

    <!-- Main Payment Body -->
    <div id="payment-body" class="p-6 space-y-6">
      
      <div id="verification-notice" role="status" class="p-4 rounded-xl bg-amber-50 text-amber-900 text-sm">
        New payments are paused. Do not send money. If you already paid, submit the reference below for review; this does not confirm payment.
      </div>
      <!-- Fallback UTR Submit Accordion -->
      <div class="border-t border-slate-100 pt-4">
        <button onclick="toggleUtrBox()" class="w-full text-xs font-bold text-indigo-600 hover:underline flex items-center justify-center gap-1.5">
          <span>Already paid? Submit your 12-digit UTR for review</span>
          <i class="fa-solid fa-chevron-down text-[10px]" id="utr-arrow"></i>
        </button>

        <div id="utr-box" class="hidden mt-3 p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
          <label class="block text-[11px] font-bold text-slate-600">Enter UPI Reference / UTR Number</label>
          <div class="flex gap-2">
            <input type="text" id="utr-input" maxlength="12" inputmode="numeric" pattern="[0-9]{12}" placeholder="e.g. 427928392019" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs mono">
            <button onclick="submitUtr()" id="btn-submit-utr" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-sm transition">
              Submit for review
            </button>
          </div>
          <p id="utr-msg" class="text-[11px] text-slate-500 font-medium"></p>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="bg-slate-50 p-4 border-t border-slate-100 text-center text-[10px] text-slate-400 font-semibold">
      Powered by ThuruvanPay Gateway Engine &bull; Payment review
    </div>

  </div>

  <script>
    const orderId = new URLSearchParams(window.location.search).get('order_id');
    let reviewAllowed = false;
    const notice = document.getElementById('verification-notice');
    const submitButton = document.getElementById('btn-submit-utr');
    submitButton.disabled = true;

    async function loadOrder() {
      if (!orderId) { notice.textContent = 'Missing order ID. Contact the merchant; do not send a payment.'; return; }
      try {
        const res = await fetch(`/api/public-order/${encodeURIComponent(orderId)}`);
        const response = await res.json();
        if (!res.ok || !response.status) { notice.textContent = 'Order unavailable. Contact the merchant; do not send a payment.'; return; }
        const order = response.data;
        document.getElementById('merchant-title').textContent = `Order for ${order.upi_name || 'Merchant'}`;
        document.getElementById('order-amount').textContent = Number(order.amount).toFixed(2);
        document.getElementById('order-id-label').textContent = `Order: ${order.order_id}`;
        reviewAllowed = order.status === 'PENDING';
        submitButton.disabled = !reviewAllowed;
        if (!reviewAllowed) notice.textContent = `Recorded order status: ${order.status}. This record has not been reverified against a bank receipt. Contact support for reconciliation; do not send another payment.`;
      } catch (error) { notice.textContent = 'Unable to load the order. Please try again later; do not send a payment.'; }
    }
    function toggleUtrBox() {
      document.getElementById('utr-box').classList.toggle('hidden');
      document.getElementById('utr-arrow').classList.toggle('rotate-180');
    }
    async function submitUtr() {
      if (!reviewAllowed || submitButton.disabled) return;
      const utr = document.getElementById('utr-input').value.trim();
      const msg = document.getElementById('utr-msg');
      if (!/^\d{12}$/.test(utr)) { msg.textContent = 'Enter a 12-digit UPI reference number.'; return; }
      submitButton.disabled = true;
      submitButton.textContent = 'Submitting...';
      try {
        const res = await fetch('/api/pay/verify-utr', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ order_id: orderId, utr }) });
        const data = await res.json();
        if (res.status === 202 && data.accepted === true && data.payment_status === 'PENDING_VERIFICATION') {
          msg.textContent = `Reference recorded. Review #${data.review_id}: verification pending. No payment success or credit has been applied.`;
        } else { msg.textContent = data.message || 'Reference could not be recorded. No payment was approved.'; }
      } catch (error) { msg.textContent = 'Connection error. You may retry the same reference safely.'; }
      finally { submitButton.disabled = !reviewAllowed; submitButton.textContent = 'Submit for review'; }
    }
    loadOrder();
  </script>
</body>
</html>
