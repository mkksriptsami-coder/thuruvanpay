<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merchant Portal - Login / Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 p-8 sm:p-10">
    <!-- Header -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-2 mb-3">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <span class="text-2xl font-black text-slate-900 tracking-tight">Thuruvan<span class="text-indigo-600">Pay</span></span>
      </a>
      <h2 id="form-title" class="text-xl font-bold text-slate-900">Merchant Account Login</h2>
      <p id="form-desc" class="text-sm text-slate-500 mt-1">Access your gateway keys, dashboard & transactions</p>
    </div>

    <!-- Toggle Buttons -->
    <div class="grid grid-cols-2 gap-1 p-1 bg-slate-100 rounded-xl mb-6 text-sm font-semibold text-slate-600">
      <button id="tab-login" onclick="switchTab('login')" class="py-2.5 rounded-lg bg-white text-indigo-600 shadow-sm transition">Login</button>
      <button id="tab-register" onclick="switchTab('register')" class="py-2.5 rounded-lg hover:text-indigo-600 transition">Register</button>
    </div>

    <!-- Alert Box -->
    <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-sm font-medium"></div>

    <!-- Login Form -->
    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Email Address</label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-4 top-3.5 text-slate-400 text-sm"></i>
          <input type="email" id="login-email" required placeholder="merchant@example.com" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600 focus:bg-white transition">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400 text-sm"></i>
          <input type="password" id="login-password" required placeholder="••••••••" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600 focus:bg-white transition">
        </div>
      </div>

      <button type="submit" id="btn-login-submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 transition">
        Sign In to Portal
      </button>
    </form>

    <!-- Register Form -->
    <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Business / Merchant Name</label>
        <div class="relative">
          <i class="fa-solid fa-user absolute left-4 top-3.5 text-slate-400 text-sm"></i>
          <input type="text" id="reg-name" required placeholder="Sri Murugan Enterprises" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600 focus:bg-white transition">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Email Address</label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-4 top-3.5 text-slate-400 text-sm"></i>
          <input type="email" id="reg-email" required placeholder="name@business.com" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600 focus:bg-white transition">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">UPI ID (VPA to receive payments)</label>
        <div class="relative">
          <i class="fa-solid fa-qrcode absolute left-4 top-3.5 text-slate-400 text-sm"></i>
          <input type="text" id="reg-upi" required placeholder="mybusiness@paytm or @okaxis" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600 focus:bg-white transition">
        </div>
        <p class="text-[11px] text-slate-500 mt-1">Payments from QR codes will directly settle to this UPI address.</p>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400 text-sm"></i>
          <input type="password" id="reg-password" required minlength="6" placeholder="At least 6 characters" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600 focus:bg-white transition">
        </div>
      </div>

      <button type="submit" id="btn-reg-submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 transition">
        Create Merchant Account
      </button>
    </form>

    <div class="mt-8 text-center border-t border-slate-100 pt-6">
      <a href="/api-docs.html" class="text-xs font-semibold text-slate-500 hover:text-indigo-600 transition flex items-center justify-center gap-1">
        <i class="fa-solid fa-file-code"></i> Need integration help? View API Documentation
      </a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('tab') === 'register') {
      switchTab('register');
    }

    // Auto redirect if already logged in
    if (localStorage.getItem('token')) {
      window.location.href = '/dashboard.html';
    }

    function switchTab(tab) {
      const loginForm = document.getElementById('login-form');
      const regForm = document.getElementById('register-form');
      const tabLogin = document.getElementById('tab-login');
      const tabReg = document.getElementById('tab-register');
      const formTitle = document.getElementById('form-title');
      const formDesc = document.getElementById('form-desc');
      hideAlert();

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
        tabLogin.className = 'py-2.5 rounded-lg bg-white text-indigo-600 shadow-sm transition';
        tabReg.className = 'py-2.5 rounded-lg hover:text-indigo-600 transition';
        formTitle.textContent = 'Merchant Account Login';
        formDesc.textContent = 'Access your gateway keys, dashboard & transactions';
      } else {
        loginForm.classList.add('hidden');
        regForm.classList.remove('hidden');
        tabReg.className = 'py-2.5 rounded-lg bg-white text-indigo-600 shadow-sm transition';
        tabLogin.className = 'py-2.5 rounded-lg hover:text-indigo-600 transition';
        formTitle.textContent = 'Register New Merchant';
        formDesc.textContent = 'Generate instant API keys to accept payments';
      }
    }

    function showAlert(msg, isSuccess = false) {
      const el = document.getElementById('alert-box');
      el.className = `mb-6 p-4 rounded-xl text-sm font-medium ${isSuccess ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-rose-50 text-rose-800 border border-rose-200'}`;
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function hideAlert() {
      document.getElementById('alert-box').classList.add('hidden');
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideAlert();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login-submit');

      btn.disabled = true;
      btn.textContent = 'Authenticating...';

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.status) {
          localStorage.setItem('token', data.token);
          showAlert('Login successful! Redirecting...', true);
          setTimeout(() => window.location.href = '/dashboard.html', 800);
        } else {
          showAlert(data.message || 'Login failed');
        }
      } catch (err) {
        showAlert('Network error. Please try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In to Portal';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideAlert();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const upi_vpa = document.getElementById('reg-upi').value;
      const password = document.getElementById('reg-password').value;
      const btn = document.getElementById('btn-reg-submit');

      btn.disabled = true;
      btn.textContent = 'Creating Account...';

      try {
        const res = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, upi_vpa, password })
        });
        const data = await res.json();

        if (data.status) {
          localStorage.setItem('token', data.token);
          showAlert('Account created! Loading your dashboard...', true);
          setTimeout(() => window.location.href = '/dashboard.html', 900);
        } else {
          showAlert(data.message || 'Registration failed');
        }
      } catch (err) {
        showAlert('Network error. Please try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Merchant Account';
      }
    }
  </script>
</body>
</html>
